name: Bug report
description: A reproducible task, state or integration failure
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Commands and minimal fixture. Remove secrets, private journals and identifiers.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Kit version, Node version, OS and host
    validations:
      required: true
