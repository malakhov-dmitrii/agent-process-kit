name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: optional-automation/package-lock.json
      - name: Check zero-install surface
        run: |
          test -f starter/AGENTS.md
          test -f starter/task-journal.md
          test -f docs/how-it-works.md
          test -f docs/choosing-skills.md
          test ! -d vendor
          shasum -a 256 -c licenses/SHA256SUMS
          git diff --check
      - run: npm --prefix optional-automation ci --ignore-scripts
      - run: npm --prefix optional-automation run verify
      - run: npm --prefix optional-automation run pack:check
